plugins { id 'com.android.application' }
android {
    namespace 'br.com.radiofamilia.ptt'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.radiofamilia.ptt'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
