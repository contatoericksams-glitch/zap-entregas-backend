name: NAVE Core V5 - Tests Only

on:
  push:
    branches:
      - nave-master-v5-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    if: github.ref == 'refs/heads/nave-master-v5-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: nave
    steps:
      - name: Checkout isolated V5 branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies with transient-network retries
        run: |
          npm install --ignore-scripts --no-audit --no-fund --fetch-retries=3 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000 || \
          npm install --ignore-scripts --no-audit --no-fund --fetch-retries=3
      - name: Syntax validation
        run: |
          node --check server.js
          node --check core/pilot-notify.js
          node --check core/ride-contract.js
          node --check core/nearest-pilot-preview.js
          node --check core/smart-dispatch-preview.js
          node --check core/smart-dispatch-osrm.js
          node --check core/smart-dispatch-osrm-router.js
          node --check core/smart-dispatch-osrm.test.js
          node --check core/smart-dispatch-osrm-http.test.js
          node --check core/smart-dispatch-preview.test.js
          node --check core/smart-dispatch-http.test.js
          node --check core/road-eta-preview.js
          node --check core/road-eta-router.js
          node --check core/road-eta-preview.test.js
          node --check core/road-eta-router.test.js
          node --check core/nearest-pilot-preview.test.js
          node --check core/nearest-pilot-http.test.js
          node --check core/preview-router.js
          node --check core/shared-journey-ui.test.js
          node --check core/channel-compat.js
          node --check core/reservation-plan.js
          node --check ../central-master-v4/master-auth.js
      - name: Unit and HTTP test suite
        env:
          NODE_PATH: ${{ github.workspace }}/nave/node_modules
        run: node --test core/*.test.js ../central-master-v4/master-auth.test.js

  staging-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check staging HTTPS and safety flags
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://nave-v5-homologacao.onrender.com"
          for attempt in 1 2 3 4; do
            if curl --silent --show-error --fail --max-time 50 "$BASE/healthz" -o /tmp/nave-health.json; then break; fi
            sleep 8
          done
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("/tmp/nave-health.json","utf8"));
            if(d.commercialRidesEnabled!==false || d.integrationReady!==false) process.exit(1);
            console.log("Staging health OK; commercial and WhatsApp integrations disabled");
          '
          curl --silent --show-error --fail --max-time 50 "$BASE/api/v5/status" -o /tmp/nave-v5-status.json
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("/tmp/nave-v5-status.json","utf8"));
            if(d.commercialRidesEnabled!==false || d.persistenceEnabled!==false || d.channelIntegrationEnabled!==false) process.exit(1);
            console.log("V5 preview API OK, read-only simulation");
          '
          # End-to-end journey lab: all state changes are fictional and stateless.
          curl --silent --show-error --fail --max-time 50 "$BASE/jornada-integrada.html" -o /tmp/nave-journey.html
          grep -Fq "Jornada integrada" /tmp/nave-journey.html
          grep -Fq "/api/v5/journey-lab" /tmp/nave-journey.html
          curl --silent --show-error --fail --max-time 50 \
            -X POST -H 'Content-Type: application/json' \
            -d '{"action":"start","category":"eco","scenario":"normal"}' \
            "$BASE/api/v5/journey-lab" -o /tmp/nave-journey-start.json
          node -e '
            const fs=require("fs");
            const data=JSON.parse(fs.readFileSync("/tmp/nave-journey-start.json","utf8"));
            if(data.phase!=="offer_pending"||data.driverId!=="DEMO-BETA"||
              data.commercialRidesEnabled!==false||data.persistenceEnabled!==false||
              data.whatsappSendEnabled!==false||data.paymentsEnabled!==false||
              data.realGpsUsed!==false)process.exit(1);
            fs.writeFileSync("/tmp/nave-journey-accept.json",JSON.stringify({action:"accept",state:data.state}));
          '
          curl --silent --show-error --fail --max-time 50 -X POST \
            -H 'Content-Type: application/json' -d @/tmp/nave-journey-accept.json \
            "$BASE/api/v5/journey-lab" -o /tmp/nave-journey-accepted.json
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("/tmp/nave-journey-accepted.json","utf8"));
            if(d.phase!=="driver_to_pickup"||d.whatsappSendEnabled!==false||
               d.persistenceEnabled!==false||d.paymentsEnabled!==false)process.exit(1);
            console.log("Lab journey quote, offer and acceptance OK with side effects disabled");
          '
          curl --silent --show-error --fail --max-time 50 "$BASE/pilot-app-test.html" -o /tmp/nave-pilot.html
          grep -q "NAVE" /tmp/nave-pilot.html
          echo "Pilot HTML present (outbound test disabled)"
          curl --silent --show-error --fail --max-time 50 "$BASE/gps-piloto.html" -o /tmp/nave-gps.html
          grep -q "Você controla sua localização" /tmp/nave-gps.html
          grep -q "Verificar distância até o embarque fictício" /tmp/nave-gps.html
          grep -q "nave_v5_nearest_pilot_demo" /tmp/nave-gps.html
          grep -Fq "Ponto escolhido no mapa" /tmp/nave-gps.html
          grep -Fq "p_pickup_lat:pickup.lat,p_pickup_lng:pickup.lng" /tmp/nave-gps.html
          grep -Fq "Usar ponto fictício a cerca de 2 km" /tmp/nave-gps.html
          grep -Fq "Calcular distância pelas ruas e tempo estimado" /tmp/nave-gps.html
          grep -Fq "routingConsent" /tmp/nave-gps.html
          grep -Fq "/api/v5/road-eta-preview" /tmp/nave-gps.html
          # The route proxy must reject unauthenticated users before calling a third-party provider.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"simulation":true,"consentExternalRouting":true}' "$BASE/api/v5/road-eta-preview")" = "401"
          echo "Road ETA page loaded; unauthenticated third-party routing blocked"
          grep -q "start\").disabled=true" /tmp/nave-gps.html
          echo "Pilot GPS page available and start disabled before approved RPC"
          curl --silent --show-error --fail --max-time 50 "$BASE/radar-demo.html" -o /tmp/nave-radar.html
          grep -q "Radar de despacho" /tmp/nave-radar.html
          curl --silent --show-error --fail --max-time 50 "$BASE/smart-dispatch.html" -o /tmp/nave-smart-dispatch.html
          grep -q "Quem chega primeiro" /tmp/nave-smart-dispatch.html
          grep -q "routeSource:\"synthetic\"" /tmp/nave-smart-dispatch.html
          SMART_NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > /tmp/nave-smart-payload.json <<JSON
          {"simulation":true,"routeSource":"synthetic","category":"eco","pickup":{"lat":-24.73,"lng":-53.744},"candidates":[{"id":"DEMO-SLOW","testOnly":true,"testEnabled":true,"verified":true,"electricVehicle":true,"online":true,"activeOffer":false,"locationSource":"simulated","positionUpdatedAt":"$SMART_NOW","categories":["eco"],"location":{"lat":-24.7303,"lng":-53.7441},"mockRoadRoute":{"roadDistanceMeters":3000,"etaSeconds":550}},{"id":"DEMO-FAST","testOnly":true,"testEnabled":true,"verified":true,"electricVehicle":true,"online":true,"activeOffer":false,"locationSource":"simulated","positionUpdatedAt":"$SMART_NOW","categories":["eco"],"location":{"lat":-24.738,"lng":-53.748},"mockRoadRoute":{"roadDistanceMeters":1600,"etaSeconds":280}}]}
          JSON
          curl --silent --show-error --fail --max-time 50 -H 'Content-Type: application/json' -d @/tmp/nave-smart-payload.json "$BASE/api/v5/smart-dispatch-preview" -o /tmp/nave-smart-result.json
          node -e '
            const d=JSON.parse(require("fs").readFileSync("/tmp/nave-smart-result.json","utf8"));
            if(d.selected?.driverId!=="DEMO-FAST"||d.routeSource!=="synthetic"||
               d.whatsappSendEnabled!==false||d.commercialRidesEnabled!==false||
               d.persistenceEnabled!==false||d.paymentsEnabled!==false)
              process.exit(1);
            console.log("SmartDispatch: fastest fictitious ETA wins, no commercial effects");
          '
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"simulation":true,"routeSource":"OSRM","category":"eco","pickup":{"lat":-24.73,"lng":-53.744},"candidates":[]}' "$BASE/api/v5/smart-dispatch-preview")" = "400"

          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          cat > /tmp/nave-nearest-payload.json <<JSON
          {"simulation":true,"category":"eco","pickup":{"lat":-24.73,"lng":-53.74},"candidates":[{"id":"DEMO-TEST","location":{"lat":-24.731,"lng":-53.741},"positionUpdatedAt":"$NOW","locationSource":"simulated","testOnly":true,"testEnabled":true,"online":true,"verified":true,"electricVehicle":true,"activeOffer":false,"categories":["eco"]}]}
          JSON
          curl --silent --show-error --fail --max-time 50 -H 'Content-Type: application/json' -d @/tmp/nave-nearest-payload.json "$BASE/api/v5/nearest-pilot-preview" -o /tmp/nave-nearest-result.json
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("/tmp/nave-nearest-result.json","utf8"));
            if(d.selected?.id!=="DEMO-TEST" || d.testOnly!==true ||
               d.whatsappSendEnabled!==false || d.liveGpsEnabled!==false ||
               d.commercialRidesEnabled!==false)process.exit(1);
            console.log("Fictional dispatch simulator available with no writes or WhatsApp sends");
          '

          curl --silent --show-error --fail --max-time 50 "$BASE/smart-dispatch-rotas.html" -o /tmp/nave-smart-osrm.html
          grep -Fq "ROTEAMENTO REAL · PONTOS FICTÍCIOS" /tmp/nave-smart-osrm.html
          grep -Fq "id=\"providerConsent\"" /tmp/nave-smart-osrm.html
          grep -Fq "/api/v5/smart-dispatch-osrm" /tmp/nave-smart-osrm.html
          # The provider must never be queried for unauthenticated or unconsented requests.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"simulation":true,"consentExternalRouting":true,"category":"eco","scenario":"all"}' "$BASE/api/v5/smart-dispatch-osrm")" = "401"
          echo "OSRM matrix page available, third-party route endpoint MFA protected"

          # Inbound webhook must stay forbidden in homologation regardless of credentials.
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/webhook")" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$BASE/webhook")" = "404"
          echo "Staging Meta webhook isolated (GET and POST blocked)"
          curl --silent --show-error --fail --max-time 50 "$BASE/api/v5/pilot-readiness" -o /tmp/nave-pilot-readiness.json
          node -e '
            const fs=require("fs");
            const d=JSON.parse(fs.readFileSync("/tmp/nave-pilot-readiness.json","utf8"));
            if(d.environment!=="staging" || d.notificationReady!==false ||
               d.optIn!==false || d.commercialRidesEnabled!==false)
              process.exit(1);
            if(!["supabase","adminPublicKey","metaSender","optIn"].every(k=>typeof d[k]==="boolean"))
              process.exit(1);
            console.log("Pilot notification remains safely disabled; sender credentials may be configured");
          '

  postgres-rpc-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify SQL permissions on ephemeral PostgreSQL
        run: |
          PG_CONTAINER=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)
          test -n "$PG_CONTAINER"
          docker cp nave/core/migrations/002_pilot_test_status_DRAFT.sql "$PG_CONTAINER":/tmp/002_pilot_test_status_DRAFT.sql
          sed "s@\\\\i nave/core/migrations/002_pilot_test_status_DRAFT.sql@\\\\i /tmp/002_pilot_test_status_DRAFT.sql@" nave/core/migrations/003_local_rpc_test.sql > /tmp/nave-local-test.sql
          docker cp /tmp/nave-local-test.sql "$PG_CONTAINER":/tmp/nave-local-test.sql
          docker exec "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/nave-local-test.sql

  postgres-gps-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: gps-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real GPS security RPC in isolated PostgreSQL
        run: |
          PG_CONTAINER=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)
          test -n "$PG_CONTAINER"
          docker cp nave/core/migrations/004_pilot_gps_DRAFT.sql "$PG_CONTAINER":/tmp/nave-gps-migration.sql
          docker cp nave/core/migrations/004_pilot_gps_isolated_test.sql "$PG_CONTAINER":/tmp/nave-gps-test.sql
          docker exec "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/nave-gps-test.sql

  postgres-shared-journey-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fictional-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify security and idempotent journey state in temporary PostgreSQL
        run: |
          set -euo pipefail
          PG_CONTAINER=$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)
          test -n "$PG_CONTAINER"
          docker cp nave/core/migrations/006_shared_journey_lab_DRAFT.sql "$PG_CONTAINER":/tmp/nave-shared-lab-migration.sql
          docker cp nave/core/migrations/006_shared_journey_lab_isolated_test.sql "$PG_CONTAINER":/tmp/nave-shared-lab-test.sql
          docker exec "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/nave-shared-lab-test.sql
