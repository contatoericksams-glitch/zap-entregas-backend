name: NAVE isolated Auth and OTP tests
on:
  push:
    branches: [codex/nave-wa-account-link-draft]
permissions:
  contents: read
jobs:
  real-auth-isolated:
    if: github.repository == 'contatoericksams-glitch/zap-entregas-backend' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test dependencies and CLI
        run: |
          npm ci --prefix nave --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/nave-tools" --no-save --no-package-lock --no-audit --no-fund supabase@2.122.0
      - name: Install pinned Chromium only in the ephemeral runner
        run: node nave/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build temporary unlinked Supabase project
        shell: bash
        run: |
          set -euo pipefail
          CLI="$RUNNER_TEMP/nave-tools/node_modules/.bin/supabase"
          LAB="$RUNNER_TEMP/nave-auth-lab"
          mkdir -p "$LAB"
          "$CLI" --help > /dev/null
          "$CLI" init --workdir "$LAB" --yes
          node nave/ci/configure-auth-lab.cjs "$LAB/supabase/config.toml"
          "$CLI" migration new channel_link_ci --workdir "$LAB"
          MIGRATION=$(find "$LAB/supabase/migrations" -name '*_channel_link_ci.sql' -print -quit)
          test -n "$MIGRATION"
          cat nave/ci/channel-link-fixture.sql nave/core/migrations/009_channel_link_otp_DRAFT.sql nave/assisted/schema.sql nave/ci/assisted-fixture.sql > "$MIGRATION"
          "$CLI" start --workdir "$LAB" --exclude realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/nave-start.log" 2>&1
          "$CLI" db reset --local --no-seed --workdir "$LAB" --yes > "$RUNNER_TEMP/nave-reset.log" 2>&1
          umask 077
          "$CLI" status --workdir "$LAB" --output json > "$RUNNER_TEMP/nave-status.json"
      - name: Check local contracts and user interfaces
        run: node --test nave/core/*.test.js central-master-v4/*.test.js
      - name: Exercise real Auth, app permissions, Data API and server-only OTP RPCs
        env:
          NAVE_TEST_STATUS_FILE: ${{ runner.temp }}/nave-status.json
        run: node --test nave/ci/channel-link-auth.ci.cjs
      - name: Verify controlled process restarts with a runner-only checkpoint
        env:
          NAVE_TEST_STATUS_FILE: ${{ runner.temp }}/nave-status.json
        run: node --test nave/ci/checkpoint-restart.ci.cjs
      - name: Exercise separate browser contexts with real fixture accounts
        env:
          NAVE_TEST_STATUS_FILE: ${{ runner.temp }}/nave-status.json
        run: node --test nave/ci/app-browser.ci.cjs
      - name: Validate integrated assisted pilot, durable rides and email recovery
        env:
          NAVE_TEST_STATUS_FILE: ${{ runner.temp }}/nave-status.json
        run: node --test nave/ci/assisted.ci.cjs
      - name: Stop this ephemeral stack
        if: always()
        shell: bash
        run: |
          CLI="$RUNNER_TEMP/nave-tools/node_modules/.bin/supabase"
          LAB="$RUNNER_TEMP/nave-auth-lab"
          if [ -x "$CLI" ] && [ -f "$LAB/supabase/config.toml" ]; then
            "$CLI" stop --workdir "$LAB" --no-backup > "$RUNNER_TEMP/nave-stop.log" 2>&1
          fi
