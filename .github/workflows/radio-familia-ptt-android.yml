name: Radio Familia - gerar APK Android
on:
  workflow_dispatch:
  push:
    branches:
      - radio-familia-ptt-v1
    paths:
      - 'radio-familia-ptt/android/**'
      - '.github/workflows/radio-familia-ptt-android.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: SDK plataforma 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar aplicativo
        working-directory: radio-familia-ptt/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publicar APK de teste
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Familia-APK
          path: radio-familia-ptt/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
